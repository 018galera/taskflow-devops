version: '3.9'

services:
  backend:
    build: ./backend
    container_name: taskflow-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=/app/data/taskflow.db
      - NODE_ENV=production
    volumes:
      - taskflow-data:/app/data
    restart: unless-stopped

volumes:
  taskflow-data: